# Implementation DAG — six independent build/prepare units plus a single
# cross-language verification unit and two independent source-analysis
# witness. The language units share no artifacts (compiled languages
# write their own binaries; AWK is interpreted); the verify unit
# consumes one `ART:` per language and produces the final contract
# `OUT:` deliverable.
#
# The shape is a fan-in: layers 0..4 are parallelizable; layer 1 is the
# critical-path leaf because the verification depends on every binary.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

