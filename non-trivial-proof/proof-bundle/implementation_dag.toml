# Implementation DAG — seven layer-0 build/prepare units fan into one layer-1
# verification unit (the load-bearing service-contract witness), plus two
# independent behavioural sidecar leaves (graceful-vs-kill, awk-boundary).
# DESIGN.md §4. U02 is the single Node/V8 unit that prepares BOTH the JavaScript
# and the TypeScript servers (they share the runtime). The fan-in into U08 is
# load-bearing for correctness here, not just tidy: U08 serializes the language
# runs on :8080 (Java first — its HttpServer cannot set SO_REUSEADDR, §3).
#
# leaf_nodes are the three units with empty `blocks`: U08 (verifier) + U09/U10
# (sidecars). U09/U10 have empty depends_on AND empty blocks, so they are both
# entry_points and leaf_nodes (the validator allows a node to be both).

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

