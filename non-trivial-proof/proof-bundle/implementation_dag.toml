# Implementation DAG — seven layer-0 build/prepare units fan into one layer-1
# verification unit (the load-bearing service-contract witness), plus four
# independent behavioural sidecar leaves (graceful-vs-kill, awk-boundary,
# differential-agreement, inflight-window). DESIGN.md §4. U02 is the single Node/V8
# unit that prepares BOTH the JavaScript and the TypeScript servers (they share the
# runtime). The fan-in into U08 is load-bearing for correctness here, not just
# tidy: U08 serializes the language runs on :8080 in plain build order, with NO
# privileged position (the retracted Java SO_REUSEADDR special case is gone, §3.1).
#
# leaf_nodes are the five units with empty `blocks`: U08 (verifier) + U09/U10/U11/U12
# (sidecars). U09/U10/U11/U12 have empty depends_on AND empty blocks, so they are
# both entry_points and leaf_nodes (the validator allows a node to be both).

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
