id       = "OUT:service-contract-witness"
name     = "Service-contract enforcement witness (C01..C05)"
realizes = ["FEAT:multilang-echo-service", "INT:stateful-io-proof"]

[[outputs]]
id       = "OUT:graceful-shutdown-witness"
name     = "Graceful-vs-kill negative-control witness"
realizes = ["FEAT:graceful-vs-kill", "INT:graceful-shutdown-detection"]

[[outputs]]
