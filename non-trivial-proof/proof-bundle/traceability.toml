[[tests]]
id        = "TEST:stateful-io-proof::service-contract"
path      = "non-trivial-proof/proof-bundle/run_service_contract.sh"
test_kind = "e2e"
verifies  = ["REQ:echo-service-lifecycle"]
command   = "bash non-trivial-proof/proof-bundle/run_service_contract.sh"

[[tests]]
id        = "TEST:stateful-io-proof::graceful-vs-kill"
path      = "non-trivial-proof/proof-bundle/detect_graceful_shutdown.sh"
test_kind = "smoke"
verifies  = ["REQ:non-graceful-server-caught"]
command   = "bash non-trivial-proof/proof-bundle/detect_graceful_shutdown.sh"

[[tests]]
id        = "TEST:stateful-io-proof::awk-boundary"
path      = "non-trivial-proof/proof-bundle/detect_awk_boundary.sh"
test_kind = "smoke"
verifies  = ["REQ:awk-boundary-declared"]
command   = "bash non-trivial-proof/proof-bundle/detect_awk_boundary.sh"

[[tests]]
id        = "TEST:stateful-io-proof::differential-agreement"
path      = "non-trivial-proof/proof-bundle/differential_echo.py"
test_kind = "e2e"
verifies  = ["REQ:differential-equivalence-nonvacuous"]
