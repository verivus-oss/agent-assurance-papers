consumes      = []

[units.U03]
name          = "materialise-v7-worktree"
summary       = "git worktree add of tag 7.0.0 (Dan Blanchard's MIT-licensed AI-rewritten release that triggered the FSF / Heather Meeker / Bruce Perens dispute) into a temporary directory."
layer         = 0
tier          = 1
status        = "done"
depends_on    = []
blocks        = ["U04", "U05"]
estimated_loc = 5
files_modify  = ["chardet-relicense/proof-bundle/detect.sh"]
produces      = ["ART:v7-worktree"]
consumes      = []

[units.U04]
name          = "extract-static-ast-signals"
summary       = "Walk both worktrees with stdlib + networkx Python; emit AUX1 (literal carryover), C06a (call-graph topology), C06b (import-edge Jaccard), C06c (control-flow histogram cosine), C06d (public-API signature equivalence) as TSV rows. No chardet install required."
layer         = 1
tier          = 1
status        = "done"
depends_on    = ["U01", "U02", "U03"]
blocks        = ["U06"]
estimated_loc = 380
files_modify  = ["chardet-relicense/proof-bundle/extract_signals.py"]
produces      = ["ART:static-ast-tsv"]
consumes      = [
  "ART:chardet-clone-verified",
  "ART:v6-worktree",
  "ART:v7-worktree",
]

[units.U05]
name          = "extract-behavioural-fingerprint"
summary       = "Install chardet from both worktrees into isolated venvs, run each `chardet.detect()` on a deterministic 1000-input fuzz corpus (seed 20260522, max length 4096), report C06e exact-match and bucket-match rates. Skips cleanly on toolchain gap."
layer         = 1
tier          = 1
status        = "done"
depends_on    = ["U01", "U02", "U03"]
blocks        = ["U06"]
estimated_loc = 175
files_modify  = ["chardet-relicense/proof-bundle/fingerprint_behavior.py"]
produces      = ["ART:behavioural-fingerprint-tsv"]
consumes      = [
  "ART:chardet-clone-verified",
  "ART:v6-worktree",
  "ART:v7-worktree",
]

[units.U06]
name          = "emit-witness"
summary       = "Concatenate the static-AST TSV and behavioural-fingerprint TSV into the final witness output, with the header preserved and the DELEGATED placeholder row replaced by the real C06e row from fingerprint_behavior.py."
layer         = 2
tier          = 1
status        = "done"
depends_on    = ["U04", "U05"]
blocks        = []
estimated_loc = 40
files_modify  = ["chardet-relicense/proof-bundle/detect.sh"]
produces      = ["OUT:chardet-relicense-semantic-witness"]
consumes      = [
  "ART:static-ast-tsv",
  "ART:behavioural-fingerprint-tsv",
]

