# Implementation DAG — three layer-0 prepare units (verify clone,
# materialise v6 worktree, materialise v7 worktree) fan into two
# parallel layer-1 analyser units (static-AST signals, behavioural
# fingerprint), which in turn fan into one layer-2 verify unit that
# produces the final witness.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

