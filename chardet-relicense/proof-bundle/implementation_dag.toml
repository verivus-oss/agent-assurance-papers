produces      = ["ART:chardet-clone-verified"]
consumes      = []

[units.U02]
name          = "materialise-v6-worktree"
summary       = "git worktree add of tag 6.0.0 (the last LGPL-era Mark Pilgrim/Dan Blanchard release before the AI rewrite) into a temporary directory so the analysers can walk the v6 implementation."
layer         = 0
tier          = 1
status        = "done"
depends_on    = []
blocks        = ["U04", "U05"]
estimated_loc = 5
files_modify  = ["chardet-relicense/proof-bundle/detect.sh"]
